name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Validation only: fork pull requests need repository contents and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Upaffe.slnx
      - run: dotnet build Upaffe.slnx --configuration Release --no-restore
      - run: dotnet test tests/Upaffe.UnitTests --configuration Release --no-build --no-restore
      - run: dotnet test tests/Upaffe.IntegrationTests --configuration Release --no-build --no-restore

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -- --outDir dist --emptyOutDir

  cli:
    name: CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/cli/go.mod
          cache-dependency-path: src/cli/go.sum
      - run: go generate ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  contract:
    name: OpenAPI contract and clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/cli/go.mod
          cache-dependency-path: src/cli/go.sum
      - run: npm ci --prefix src/web
      - run: scripts/check-contract.sh

  compose:
    name: Compose definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/docker-compose.dev.yml config --quiet

  system:
    name: Monitoring system test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/cli/go.mod
          cache-dependency-path: src/cli/go.sum
      - run: scripts/smoke.sh
