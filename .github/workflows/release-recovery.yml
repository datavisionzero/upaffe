name: Recover an interrupted release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version whose tag and image already exist
        required: true
        type: string
      source_run_id:
        description: Failed tag-triggered release workflow run with the CLI bundle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-recovery-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  recover:
    name: Verify the tagged artifacts and finish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      IMAGE: ghcr.io/datavisionzero/upaffe:v${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: source
        name: Validate the existing tag and failed source run
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ]
          printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo 'Expected a numeric source run ID.' >&2; exit 2 ;;
          esac
          tag="v$RELEASE_VERSION"
          git fetch --quiet origin main
          git fetch --quiet origin tag "$tag"
          revision=$(git rev-list -n 1 "$tag")
          git merge-base --is-ancestor "$revision" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$revision&branch=main&event=push&status=success&per_page=100" \
            | jq -e --arg sha "$revision" '[.workflow_runs[] |
                select(.head_sha == $sha and .head_branch == "main" and
                  .event == "push" and .conclusion == "success")] | length > 0' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            | jq -e --arg sha "$revision" --arg tag "$tag" '
                .head_sha == $sha and .head_branch == $tag and .event == "push" and
                .name == "Release candidate and publication" and
                .path == ".github/workflows/release.yml" and
                .status == "completed" and .conclusion == "failure"' >/dev/null
          git show "$tag:docs/releases/$tag.md" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Download the validated tagged CLI bundle
        run: |
          mkdir release-assets
          gh run download "$SOURCE_RUN_ID" --name cli-release-bundle --dir release-assets
          python3 scripts/check-release-bundle.py "$RELEASE_VERSION" \
            "${{ steps.source.outputs.revision }}" release-assets
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Verify the published image and complete the GitHub release
        run: |
          scripts/check-release-image.sh "$IMAGE" "$RELEASE_VERSION" \
            "${{ steps.source.outputs.revision }}" > "$RUNNER_TEMP/release-image-digest.txt"
          python3 scripts/publish-release.py "$RELEASE_VERSION" \
            "${{ steps.source.outputs.revision }}" \
            "$(cat "$RUNNER_TEMP/release-image-digest.txt")" \
            release-assets "$RUNNER_TEMP/release-notes.md"
